[compat]
# AMD 0.5.4 removed `SS_Int`, which `SparseColumnPivotedQR`'s AMD extension
# calls; `SparseColumnPivotedQR` bounds AMD at "0.5.1", so a fresh resolve picks
# 0.5.4 and `LinearSolve` — hence `OrdinaryDiffEq` — fails to precompile.
# Nothing here is at fault and nothing here can be changed to avoid it; the
# bound holds AMD at the last working version. Remove it once AMD restores the
# binding or SparseColumnPivotedQR tightens its own bound.
AMD = "0.5.1 - 0.5.3"
Documenter = "1.17"
# Bounded on the major only, deliberately: the 1.x ceiling belongs to
# DocumenterVitepress and is already declared there.
#
# Its registry entry carries a weak dependency `DocumenterCitations = "1 - 1.4"`
# for every version from 0.0.21 on, so 1.5 and 0.3.x cannot be resolved together
# — Pkg puts it as "restricted by compatibility requirements with
# DocumenterVitepress to versions 1.0.0 - 1.4.1". Writing `"1.4"` here would
# repeat that ceiling and then need an edit the day DocumenterVitepress raises
# it. `"1"` lets the resolver take the newest version both packages accept: 1.4.1
# today, 1.5 and beyond by itself later, with no change to this file. The
# `CitationSiteNode` override in `make.jl` is guarded so it starts applying on the
# same day.
#
# For the record, since nothing in this repository caused the breakage: the docs
# environment is resolved afresh on every CI run, so the release of
# DocumenterCitations 1.5.0 broke a job that had passed the day before.
DocumenterCitations = "1"
DocumenterVitepress = "0.3"
# The docs environment declares OptimaSolver directly, and without a bound here
# it resolved to 0.2.1 — whose `OptimaOptimizer` has neither `use_fd_hessian`
# nor `nullspace_step`, so every equilibrium `@example` block failed with a
# MethodError while the package's own tests passed. Keep this in step with the
# bound in the root `Project.toml`.
OptimaSolver = "0.5"
SciMLBase = "2, 3"
# SymbolicUtils is not used directly here; it is declared so that the bound
# below applies.  SymbolicUtils 4.46.0 makes `Symbolics.renamed_metadata` reach
# a latent bug -- `Base.ImmutableDict(dict, key, value)`, a three-positional-
# argument call Base does not provide -- which breaks the precompilation of
# ModelingToolkitBase, hence of DataDrivenDiffEq and SymbolicNumericIntegration,
# hence the `add_thermo_model` examples in `man/thermodynamics.md`.  Symbolics
# admits it through an open bound (`SymbolicUtils = "4.37.0 - 4"`), so the
# constraint has to be expressed here.  Verified: 4.45.0 precompiles the same
# graph, DataDrivenDiffEq 1.16.0 included.  Remove once Symbolics ships the fix.
SymbolicUtils = "~4.45"
